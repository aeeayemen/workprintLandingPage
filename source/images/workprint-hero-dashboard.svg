    <circle cx="258" cy="188" r="4.5" fill="#2684ff"/>
    <text x="268" y="192" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#172b4d"><tspan font-weight="600">Bitbucket PRs:</tspan> 12.5h (33%)</text>

    <circle cx="468" cy="188" r="4.5" fill="#00a3bf"/>
    <text x="478" y="192" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#172b4d"><tspan font-weight="600">Confluence:</tspan> 6.0h (15%)</text>

