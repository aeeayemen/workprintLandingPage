    <!-- Jira Card -->
    <rect x="36" y="224" width="192" height="106" rx="6" fill="#ffffff" stroke="#dfe1e6" stroke-width="1"/>
    <rect x="48" y="236" width="22" height="22" rx="4" fill="#deebff"/>
    <text x="59" y="251" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" fill="#0052cc" text-anchor="middle">J</text>
    <text x="76" y="251" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" fill="#172b4d">Jira Workload</text>
    <text x="48" y="282" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="22" font-weight="700" fill="#172b4d">7 Tasks</text>
    <text x="48" y="300" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#5e6c84">4 In Progress • 3 In Review</text>
    <rect x="48" y="312" width="168" height="6" rx="3" fill="#ebecf0"/>
    <rect x="48" y="312" width="134" height="6" rx="3" fill="#0052cc"/>

    <!-- Bitbucket Card -->
    <rect x="244" y="224" width="192" height="106" rx="6" fill="#ffffff" stroke="#dfe1e6" stroke-width="1"/>
    <rect x="256" y="236" width="22" height="22" rx="4" fill="#e6fcff"/>
    <text x="267" y="251" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" fill="#00a3bf" text-anchor="middle">B</text>
    <text x="284" y="251" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" fill="#172b4d">Bitbucket PRs</text>
    <text x="256" y="282" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="22" font-weight="700" fill="#172b4d">4 Reviews</text>
    <text x="256" y="300" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#ff8b00">2.5h Turnaround Lag</text>
    <rect x="256" y="312" width="168" height="6" rx="3" fill="#ebecf0"/>
    <rect x="256" y="312" width="112" height="6" rx="3" fill="#2684ff"/>

    <!-- Confluence Card -->
    <rect x="452" y="224" width="192" height="106" rx="6" fill="#ffffff" stroke="#dfe1e6" stroke-width="1"/>
    <rect x="464" y="236" width="22" height="22" rx="4" fill="#eae6ff"/>
    <text x="475" y="251" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" fill="#6554c0" text-anchor="middle">C</text>
    <text x="492" y="251" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" fill="#172b4d">Confluence Specs</text>
    <text x="464" y="282" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="22" font-weight="700" fill="#172b4d">3 Pages</text>
    <text x="464" y="300" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#5e6c84">Actively authored this cycle</text>
    <rect x="464" y="312" width="168" height="6" rx="3" fill="#ebecf0"/>
    <rect x="464" y="312" width="70" height="6" rx="3" fill="#00a3bf"/>

    <!-- Rovo AI Alert Banner -->
    <rect x="36" y="342" width="608" height="74" rx="6" fill="#faf5ff" stroke="#dfd8fd" stroke-width="1"/>
    <!-- Rovo Sparkle Icon -->
    <rect x="48" y="354" width="30" height="30" rx="6" fill="url(#rovoGlow)"/>
    <path d="M63 360L64.5 365L69.5 366.5L64.5 368L63 373L61.5 368L56.5 366.5L61.5 365L63 360Z" fill="#ffffff"/>
    <text x="88" y="368" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700" fill="#403294">Workprint Rovo Capacity Agent • Sprint Health Alert</text>
    <text x="88" y="386" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#5243aa">Alex has 2 pull request reviews on critical path repo 'workprint/feature'. Sprint capacity remains balanced at 92% load.</text>
    <rect x="526" y="356" width="106" height="26" rx="4" fill="#6554c0"/>
    <text x="579" y="373" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" fill="#ffffff" text-anchor="middle">Reassign Task</text>

    <!-- Bottom Status Footer -->
    <text x="36" y="440" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#5e6c84">Atlassian Forge asApp() Security • Zero Outside Cloud Storage • 100% Real-Time Ephemeral Aggregation</text>
  </g>
</svg>